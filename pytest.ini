[pytest]
# Configuração do PyTest para o trabalho de Teste Automatizado (Renato e Lucas)
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
xfail_strict = true
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning

markers =
    requisito(id): teste que valida um requisito ou caso de teste do documento (ex.: RF01, CT05)
    ia: testes da inteligência artificial (CBR / vizinhos mais próximos)
    entrada: testes de entradas de dados do usuário (input simulado)
    cenario: cenários de uso ponta a ponta (partida executada pelo __main__)
    defeito(id): teste que comprova um defeito do jogo (marcado também como xfail)
    sem_adaptador: roda sem o adaptador de CSV, na raiz do projeto (como o usuário executa o jogo)
    lento: testes que carregam a base de casos completa (alguns segundos)
